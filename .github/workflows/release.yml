name: Manual Unsigned Build Evidence

# Deliberately no tag/push/release trigger, publishing token, signing identity,
# package upload, gh release command, or claim of completed VM validation.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Development version, for example 0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  VERSION: ${{ inputs.version }}
  COMMIT: ${{ github.sha }}

jobs:
  unsigned-development-evidence:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use the official archive and the checked-in Go 1.27.3 checksum
        run: |
          test "$(id -u)" -ne 0
          timeout --kill-after=5s 180s bash scripts/download-go.sh "$RUNNER_TEMP/soteria-go"
          printf '%s\n' "$RUNNER_TEMP/soteria-go/bin" >> "$GITHUB_PATH"
      - name: Validate version without interpolating input into shell code
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          [[ $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]+[-~][A-Za-z0-9.+~-]+$ ]]
      - run: timeout --kill-after=5s 180s make fmt-check script-check helper-test
      - run: timeout --kill-after=5s 180s make test
      - run: timeout --kill-after=5s 180s make vet
      - run: timeout --kill-after=5s 180s make race
      - name: Create unsigned CLI archive, actual Go SBOM, checksums, and missing-gates record
        run: timeout --kill-after=5s 180s make evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-development-${{ github.sha }}
          path: dist/evidence/
          if-no-files-found: error
          retention-days: 14
